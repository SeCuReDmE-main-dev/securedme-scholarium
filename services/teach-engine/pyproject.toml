[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "scholarium-teach-engine"
version = "0.1.0"
description = "Deterministic syllable-first decision engine for Scholarium Teach"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.116.1",
  "pydantic==2.13.4",
  "python-multipart==0.0.20",
  "uvicorn[standard]==0.35.0"
]

[project.optional-dependencies]
test = ["httpx==0.28.1", "pytest==8.4.1"]

[tool.hatch.build.targets.wheel]
packages = ["src/scholarium_teach_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
